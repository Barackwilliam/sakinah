{% if f.widget_type == 'checkbox' %}<label class="af2 chk{% if f.errors %} bad{% endif %}">{{ f }}<span>{{ f.label }}{% if f.help_text %}<small>{{ f.help_text }}</small>{% endif %}</span>{% for e in f.errors %}<em>{{ e }}</em>{% endfor %}</label>
{% else %}<label class="af2{% if f.widget_type == 'textarea' or f.widget_type == 'clearablefile' or wide %} wide{% endif %}{% if f.errors %} bad{% endif %}"><span>{{ f.label }}{% if f.field.required %} <b>*</b>{% endif %}</span>{{ f }}{% if f.help_text %}<small>{{ f.help_text }}</small>{% endif %}{% for e in f.errors %}<em>{{ e }}</em>{% endfor %}</label>{% endif %}
