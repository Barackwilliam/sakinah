<span class="imgw">{% if widget.is_initial %}<a class="imgw-cur" href="{{ widget.value.url }}" target="_blank">{% if widget.is_image %}<img src="{{ widget.value.url }}" alt="">{% else %}<svg><use href="#m-doc"/></svg>{% endif %}</a>{% else %}<span class="imgw-cur empty"><svg><use href="#m-image"/></svg></span>{% endif %}
<span class="imgw-r"><label class="ab o sm imgw-btn"><svg><use href="#m-camera"/></svg>{% if widget.is_initial %}Change{% else %}Upload{% endif %}<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %} hidden onchange="this.closest('.imgw').querySelector('.imgw-name').textContent=this.files.length?this.files[0].name:''"></label>
<small class="imgw-name">{% if widget.is_initial %}{{ widget.value.name|cut:"/"|slice:"-40:" }}{% endif %}</small>
{% if widget.is_initial and not widget.required %}<label class="imgw-clear"><input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}">Remove</label>{% endif %}</span></span>
