{% if f.widget_type == 'checkbox' %}<label class="ff ff-chk{% if wide %} wide{% endif %}">{{ f }}<span class="sw"></span><span>{{ f.label }}{% if f.help_text %}<small>{{ f.help_text }}</small>{% endif %}</span>{% for e in f.errors %}<em>{{ e }}</em>{% endfor %}</label>
{% else %}<label class="ff{% if wide or f.widget_type == 'textarea' %} wide{% endif %}{% if f.errors %} bad{% endif %}"><span>{{ f.label }}{% if f.field.required %} <b>*</b>{% endif %}</span>{{ f }}{% if f.help_text %}<small>{{ f.help_text }}</small>{% endif %}{% for e in f.errors %}<em>{{ e }}</em>{% endfor %}</label>{% endif %}
