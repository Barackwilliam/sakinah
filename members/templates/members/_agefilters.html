<div class="fsel"><select name="show" onchange="this.form.submit()"><option value="">All Members</option><option value="verified" {% if f.show == 'verified' %}selected{% endif %}>Verified Only</option>{% if with_premium %}<option value="premium" {% if f.show == 'premium' %}selected{% endif %}>Premium Only</option>{% endif %}</select></div>
<div class="fsel"><select name="city" onchange="this.form.submit()"><option value="">All Locations</option>{% for l in locations %}<option {% if f.city == l %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
<div class="fsel"><select name="age" onchange="this.form.submit()"><option value="">All Ages</option>{% for a, label in age_opts %}<option value="{{ a }}" {% if f.age == a %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
