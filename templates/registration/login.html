{% extends "base.html" %}{% block title %}Login - {{ site.brand }}{% endblock %}
{% block content %}<section class="authbox panel">
  <h1>Welcome back</h1><p class="sub">Log in to see your matches and likes.</p>
  <form method="post" class="form">{% csrf_token %}{% include "partials/form.html" %}<input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-s block">Login</button></form>
  <p class="alt">New to {{ site.brand }}? <a href="{% url 'signup' %}">Join free</a></p>
</section>{% endblock %}
