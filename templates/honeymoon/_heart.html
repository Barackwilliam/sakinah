{% if user.is_authenticated %}<form method="post" action="{% url 'hm_save' %}" class="hm-heart">{% csrf_token %}<input type="hidden" name="kind" value="{{ kind }}"><input type="hidden" name="pk" value="{{ obj.pk }}"><input type="hidden" name="next" value="{{ request.get_full_path }}"><button aria-label="{% if on %}Remove from favourites{% else %}Save to favourites{% endif %}" class="{% if on %}on{% endif %}"><svg><use href="{{ icons }}#i-heart{% if on %}-f{% endif %}"/></svg></button></form>
{% else %}{% with u=request.get_full_path %}<a class="hm-heart" href="{% url 'login' %}?next={{ u|urlencode }}" data-auth="{{ u }}" aria-label="Save to favourites"><span><svg><use href="{{ icons }}#i-heart"/></svg></span></a>{% endwith %}{% endif %}
