{% if user.is_authenticated %}
<a class="btn btn-o" href="{% if user.member %}{% url 'member' user.member.pk %}{% else %}{% url 'profile_edit' %}{% endif %}">My Profile</a>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-s">Logout</button></form>
{% else %}<a class="btn btn-o" href="{% url 'login' %}">Login</a><a class="btn btn-s" href="{% url 'signup' %}">Join Free</a>{% endif %}
