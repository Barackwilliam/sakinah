{% load i18n lang %}<div class="fld{% if f.errors %} bad{% endif %}{% if wide %} wide{% endif %}">
  <label for="{{ f.id_for_label }}">{{ f.label|tr }}</label>
  <div class="ctl{% if f.field.widget.input_type == 'password' %} pw{% endif %}">{% if icon %}<svg class="ctl-i"><use href="{{ icons }}#i-{{ icon }}"/></svg>{% endif %}{{ f }}
    {% if f.field.widget.input_type == 'password' %}<button type="button" class="eye" aria-label="{% translate 'Show password' %}" data-eye><svg><use href="{{ icons }}#i-eye"/></svg></button>{% endif %}</div>
  {% if f.errors %}{{ f.errors }}{% elif f.help_text %}<small>{{ f.help_text|tr|safe }}</small>{% endif %}
</div>
