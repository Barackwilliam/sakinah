{% load i18n %}{% if user.is_authenticated %}<form class="likef" method="post" action="{% url 'like' m.pk %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
<button class="btn btn-like {{ cls }}{% if m.pk in liked %} on{% endif %}"><svg><use href="{{ icons }}#i-heart-f"/></svg>{% if m.pk in liked %}{% translate "Liked" %}{% else %}{% translate "Like" %}{% endif %}</button></form>
{% else %}<a class="btn btn-like {{ cls }}" href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}" data-auth="{{ request.get_full_path }}"><svg><use href="{{ icons }}#i-heart-f"/></svg>{% translate "Like" %}</a>{% endif %}
