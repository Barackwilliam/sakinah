{% load static assets %}{% if user.is_authenticated and not user.is_staff %}<link rel="stylesheet" href="{% asset 'css/calls.css' %}">
<div class="ic-wrap" id="incoming-call" data-poll="{% url 'm_call_incoming' %}" hidden role="dialog" aria-live="assertive" aria-label="Incoming call">
  <div class="ic-card">
    <div class="ic-av"><span class="ic-ring"></span><span class="ic-ring r2"></span><img class="ic-photo" alt="" hidden><b class="ic-letter"></b></div>
    <p class="ic-kind">Incoming call…</p><h3 class="ic-name"></h3>
    <div class="ic-btns">
      <button type="button" class="ic-decline" aria-label="Decline"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 9c-1.6 0-3.2.3-4.7.7v3.1c0 .4-.2.7-.6.9-1 .5-1.9 1.1-2.7 1.8-.2.2-.4.3-.7.3s-.5-.1-.7-.3L.3 13.3a1 1 0 0 1 0-1.4C3.3 9.1 7.5 7.4 12 7.4s8.7 1.7 11.7 4.5c.4.4.4 1 0 1.4l-2.3 2.2c-.2.2-.4.3-.7.3s-.5-.1-.7-.3c-.8-.7-1.7-1.3-2.7-1.8-.3-.2-.6-.5-.6-.9V9.7C15.2 9.3 13.6 9 12 9z"/></svg><small>Decline</small></button>
      <a class="ic-accept" href="#" aria-label="Answer"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.3.2 2.5.6 3.6a1 1 0 0 1-.25 1z"/></svg><small>Answer</small></a>
    </div>
  </div>
</div>
<script src="{% asset 'js/calls.js' %}" defer></script>{% endif %}
