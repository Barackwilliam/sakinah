{% load i18n %}{% get_current_language as LANG %}{% get_available_languages as LANGUAGES %}{% get_language_info_list for LANGUAGES as LANGS %}
<details class="lang{% if lang_cls %} {{ lang_cls }}{% endif %}"><summary aria-label="{% translate 'Language' %}" title="{% translate 'Language' %}"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.500 2.600 3.800 5.600 3.800 9s-1.300 6.400-3.800 9c-2.500-2.600-3.800-5.600-3.800-9S9.500 5.600 12 3z"/></svg><b>{{ LANG|upper }}</b></summary>
  <form method="post" action="{% url 'set_language' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
    {# each language in its own name and script, so anyone can find theirs #}{% for l in LANGS %}<button name="language" value="{{ l.code }}" lang="{{ l.code }}" dir="{{ l.bidi|yesno:'rtl,ltr' }}"{% if l.code == LANG %} aria-current="true"{% endif %}><i>{{ l.code|upper }}</i>{{ l.name_local|capfirst }}</button>{% endfor %}</form></details>
